  root.appendChild(c);
}

// Execution log
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-clock-rotate-left mr-2 text-indigo-400"></i>Execution log — one row per completed pass'));
  const t = el('table', 'mt-3');
  t.innerHTML = '<thead><tr><th>Date</th><th>Commit(s)</th><th>Scope</th><th>Verification level</th></tr></thead>';
  const tb = el('tbody');
  DATA.executionLog.forEach(([d, h, scope, ver]) => {
    tb.appendChild(el('tr', '', `<td class="mono text-slate-400 whitespace-nowrap">${d}</td><td class="mono text-cyan-300 whitespace-nowrap">${h}</td><td class="text-slate-300">${scope}</td><td class="text-slate-400">${ver}</td>`));
  });
  t.appendChild(tb);
  c.appendChild(t);
  c.appendChild(el('p', 'note mt-3', '<strong class="text-slate-400">Verification key:</strong> Smoke-tested = exercised by hand in the running app · curl-verified = scripted live requests against a running instance · Unit-tested = Vitest inside real workerd + real D1 · Browser-verified = Playwright driving the real SPA in Chromium · verified-can-fail = the protection was deliberately broken, the tests failed, and the revert was confirmed byte/sha1-identical.'));
  root.appendChild(c);
}

// Test coverage snapshot
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-vial-circle-check mr-2 text-green-400"></i>Test-coverage snapshot'));
  const grid = el('div', 'grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-4');
  DATA.testCoverage.cells.forEach(([big, label, sub]) => {
    grid.appendChild(el('div', 'border border-slate-800 rounded-xl p-4 text-center',
      `<div class="text-2xl font-extrabold text-green-300 mono">${big}</div><div class="text-sm font-semibold mt-1">${label}</div><div class="note mt-1">${sub}</div>`));
  });
  c.appendChild(grid);
  const ul = el('ul', 'mt-4 space-y-1 text-[13px] text-slate-300');
  DATA.testCoverage.bullets.forEach(b => ul.appendChild(el('li', '', '<i class="fas fa-check text-green-400 mr-2"></i>' + b)));
  c.appendChild(ul);
  c.appendChild(el('div', 'mt-3 border border-amber-500/20 bg-amber-500/5 rounded-xl p-3 text-[13px] text-amber-200',
    '<i class="fas fa-hand mr-2"></i>' + DATA.testCoverage.manualOnly));
  root.appendChild(c);
}

// Backlog
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-box-archive mr-2 text-slate-400"></i>Backlog / deferred'));
  const t = el('table', 'mt-3');
  t.innerHTML = '<thead><tr><th>Item</th><th>Status</th><th>Trigger</th></tr></thead>';
  const tb = el('tbody');
  DATA.backlog.forEach(([item, status, trigger]) => {
    const b = status === 'Open' ? 'b-prog' : 'b-not';
    tb.appendChild(el('tr', '', `<td class="text-slate-300">${item}</td><td><span class="badge ${b}">${status}</span></td><td class="text-slate-400">${trigger}</td>`));
  });
  t.appendChild(tb);
  c.appendChild(t);
  root.appendChild(c);
}

// Outstanding / next actions
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-flag mr-2 text-amber-400"></i>Outstanding / next actions'));
  const ul = el('ul', 'mt-3 space-y-2 text-[13px] text-slate-300');
  DATA.outstanding.forEach(t => ul.appendChild(el('li', '', '<i class="fas fa-angle-right text-amber-400 mr-2"></i>' + t)));
  c.appendChild(ul);
  root.appendChild(c);
}

// Honesty footer
root.appendChild(el('p', 'note text-center pb-6',
  `<i class="fas fa-scale-balanced mr-1"></i>Accuracy over optimism: this tracker records verified state only. ${DATA.meta.figuresSource}`));
</script>
</body>
</html>
