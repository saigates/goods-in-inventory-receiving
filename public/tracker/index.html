  'Known-but-accepted: dev-login auth story and token-in-URL for print windows — both flagged for pre-production hardening, not blockers for internal use.',
];
</script>
<script>
// ── Rendering only below this line ──
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const root = document.getElementById('root');

// Header + progress
{
  const pct = Math.floor(DATA.progress.done / DATA.progress.total * 100);
  const c = el('section', 'card p-6');
  c.appendChild(el('div', 'flex items-center justify-between flex-wrap gap-3',
    `<div>
       <h1 class="text-2xl font-bold"><i class="fas fa-list-check mr-2 text-cyan-400"></i>${DATA.meta.project} — Master Checklist</h1>
       <p class="note mt-1">Last updated ${DATA.meta.lastUpdated} · commit <span class="mono text-slate-300">${DATA.meta.commit}</span> (${DATA.meta.commitNote})</p>
     </div>
     <div class="text-right">
       <div class="text-4xl font-extrabold text-cyan-300">${pct}%</div>
       <div class="note">${DATA.progress.done} of ${DATA.progress.total} tracked items done</div>
     </div>`));
  const bar = el('div', 'bar mt-4'); bar.appendChild(el('div', '', '')); bar.firstChild.style.width = pct + '%';
  c.appendChild(bar);
  c.appendChild(el('p', 'note mt-3', `<strong class="text-slate-400">How this number is derived:</strong> ${DATA.progress.formula}`));
  c.appendChild(el('p', 'note mt-1', DATA.progress.remainingNote));
  root.appendChild(c);
}

// Phases (built)
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-layer-group mr-2 text-indigo-400"></i>Phases — built application'));
  DATA.phases.forEach(p => {
    const st = p.status === 'done' ? '<span class="badge b-done"><i class="fas fa-check"></i>done</span>'
             : '<span class="badge b-prog"><i class="fas fa-hourglass-half"></i>in progress</span>';
    const box = el('div', 'mt-4 border border-slate-800 rounded-xl p-4');
    box.appendChild(el('div', 'flex items-center justify-between flex-wrap gap-2',
      `<div class="font-semibold text-sm">${p.name} <span class="text-slate-500 mono">${p.done}/${p.total}</span></div><div>${st}</div>`));
    if (p.note) box.appendChild(el('p', 'note mt-1', p.note));
    const ul = el('ul', 'mt-2 space-y-1 text-[13px]');
    p.items.forEach(([txt, s]) => {
      const ic = s === 'done' ? '<i class="fas fa-check text-green-400 mr-2"></i>'
               : s === 'fixed' ? '<i class="fas fa-bug text-red-400 mr-2"></i>'
               : '<i class="far fa-circle text-slate-600 mr-2"></i>';
      const tag = s === 'fixed' ? ' <span class="badge b-fix">defect found &amp; fixed</span>' : '';
      ul.appendChild(el('li', s === 'not' ? 'text-slate-500' : 'text-slate-300', ic + txt + tag));
    });
    box.appendChild(ul);
    c.appendChild(box);
  });
  root.appendChild(c);
}

// OPR track
{
  const c = el('section', 'card p-6 border-cyan-900/40');
  const oprDone = DATA.oprTracks.reduce((s, t) => s + t.done, 0);
  const oprTotal = DATA.oprTracks.reduce((s, t) => s + t.total, 0);
  c.appendChild(el('h2', '', `<i class="fas fa-ship mr-2 text-cyan-400"></i>${DATA.oprIntro.heading} <span class="badge ${oprDone ? 'b-prog' : 'b-not'} ml-2">${oprDone}/${oprTotal}</span>`));
  c.appendChild(el('p', 'text-[13px] text-slate-400 mt-2', DATA.oprIntro.text));
  DATA.oprTracks.forEach(t => {
    const isDone = t.status === 'done';
    const box = el('div', 'mt-4 border border-slate-800 rounded-xl p-4');
    box.appendChild(el('div', 'flex items-center justify-between flex-wrap gap-2',
      `<div class="font-semibold text-sm">${t.name} <span class="text-slate-500 mono">${t.done}/${t.total}</span></div>
       ${isDone ? '<span class="badge b-done"><i class="fas fa-check"></i>done (API-level)</span>' : '<span class="badge b-not"><i class="far fa-circle"></i>not started</span>'}`));
    const ul = el('ul', `mt-2 space-y-1 text-[13px] ${isDone ? 'text-slate-400' : 'text-slate-500'}`);
    t.items.forEach(txt => ul.appendChild(el('li', '', (isDone ? '<i class="fas fa-check text-emerald-500 mr-2"></i>' : '<i class="far fa-circle text-slate-700 mr-2"></i>') + txt)));
    box.appendChild(ul);
    c.appendChild(box);
  });
  const g = el('div', 'mt-4 border border-slate-800 rounded-xl p-4 flex items-center justify-between');
  g.innerHTML = `<div class="font-semibold text-sm">${DATA.grading.name} <span class="text-slate-500 mono">${DATA.grading.done}/${DATA.grading.total}</span></div>
                 <span class="badge b-not"><i class="far fa-circle"></i>not started</span>`;
  c.appendChild(g);
  root.appendChild(c);
}

// OPR reference values
{
  const r = DATA.oprReference;
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', `<i class="fas fa-file-shield mr-2 text-cyan-400"></i>${r.heading} <span class="badge b-ref ml-2">reference / configuration</span>`));
  c.appendChild(el('p', 'note mt-1', 'Displayed for scope accuracy only — no executable customs logic exists yet. When OPR is built, these values must live in a configurable Authorisation record, not inline in code.'));
  const grid = el('div', 'grid md:grid-cols-2 gap-4 mt-4');
  r.groups.forEach(gr => {
    const box = el('div', 'border border-slate-800 rounded-xl p-4');
    box.appendChild(el('div', 'text-xs font-bold uppercase tracking-wider text-slate-400 mb-2', gr.title));
    gr.rows.forEach(([k, v]) => {
      box.appendChild(el('div', 'mb-2', `<div class="note">${k}</div><div class="text-[13px] mono text-slate-200">${v}</div>`));
    });
    grid.appendChild(box);
  });
  c.appendChild(grid);
  const cons = el('div', 'mt-4 border border-amber-500/20 bg-amber-500/5 rounded-xl p-4');
  cons.appendChild(el('div', 'text-xs font-bold uppercase tracking-wider text-amber-300 mb-2', '<i class="fas fa-triangle-exclamation mr-1"></i>Critical distinctions (learned constraints)'));
  const ul = el('ul', 'space-y-1 text-[13px] text-slate-300');
  r.constraints.forEach(t => ul.appendChild(el('li', '', '<i class="fas fa-angle-right text-amber-400 mr-2"></i>' + t)));
  cons.appendChild(ul);
  c.appendChild(cons);
  root.appendChild(c);
}

// Execution log
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-clock-rotate-left mr-2 text-indigo-400"></i>Execution log — one row per completed pass'));
  const t = el('table', 'mt-3');
  t.innerHTML = '<thead><tr><th>Date</th><th>Commit(s)</th><th>Scope</th><th>Verification level</th></tr></thead>';
  const tb = el('tbody');
  DATA.executionLog.forEach(([d, h, scope, ver]) => {
    tb.appendChild(el('tr', '', `<td class="mono text-slate-400 whitespace-nowrap">${d}</td><td class="mono text-cyan-300 whitespace-nowrap">${h}</td><td class="text-slate-300">${scope}</td><td class="text-slate-400">${ver}</td>`));
  });
  t.appendChild(tb);
  c.appendChild(t);
  c.appendChild(el('p', 'note mt-3', '<strong class="text-slate-400">Verification key:</strong> Smoke-tested = exercised by hand in the running app · curl-verified = scripted live requests against a running instance · Unit-tested = Vitest inside real workerd + real D1 · Browser-verified = Playwright driving the real SPA in Chromium · verified-can-fail = the protection was deliberately broken, the tests failed, and the revert was confirmed byte/sha1-identical.'));
  root.appendChild(c);
}

// Test coverage snapshot
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-vial-circle-check mr-2 text-green-400"></i>Test-coverage snapshot'));
  const grid = el('div', 'grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-4');
  DATA.testCoverage.cells.forEach(([big, label, sub]) => {
    grid.appendChild(el('div', 'border border-slate-800 rounded-xl p-4 text-center',
      `<div class="text-2xl font-extrabold text-green-300 mono">${big}</div><div class="text-sm font-semibold mt-1">${label}</div><div class="note mt-1">${sub}</div>`));
  });
  c.appendChild(grid);
  const ul = el('ul', 'mt-4 space-y-1 text-[13px] text-slate-300');
  DATA.testCoverage.bullets.forEach(b => ul.appendChild(el('li', '', '<i class="fas fa-check text-green-400 mr-2"></i>' + b)));
  c.appendChild(ul);
  c.appendChild(el('div', 'mt-3 border border-amber-500/20 bg-amber-500/5 rounded-xl p-3 text-[13px] text-amber-200',
    '<i class="fas fa-hand mr-2"></i>' + DATA.testCoverage.manualOnly));
  root.appendChild(c);
}

// Backlog
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-box-archive mr-2 text-slate-400"></i>Backlog / deferred'));
  const t = el('table', 'mt-3');
  t.innerHTML = '<thead><tr><th>Item</th><th>Status</th><th>Trigger</th></tr></thead>';
  const tb = el('tbody');
  DATA.backlog.forEach(([item, status, trigger]) => {
    const b = status === 'Open' ? 'b-prog' : 'b-not';
    tb.appendChild(el('tr', '', `<td class="text-slate-300">${item}</td><td><span class="badge ${b}">${status}</span></td><td class="text-slate-400">${trigger}</td>`));
  });
  t.appendChild(tb);
  c.appendChild(t);
  root.appendChild(c);
}

// Outstanding / next actions
{
  const c = el('section', 'card p-6');
  c.appendChild(el('h2', '', '<i class="fas fa-flag mr-2 text-amber-400"></i>Outstanding / next actions'));
  const ul = el('ul', 'mt-3 space-y-2 text-[13px] text-slate-300');
  DATA.outstanding.forEach(t => ul.appendChild(el('li', '', '<i class="fas fa-angle-right text-amber-400 mr-2"></i>' + t)));
  c.appendChild(ul);
  root.appendChild(c);
}

// Honesty footer
root.appendChild(el('p', 'note text-center pb-6',
  `<i class="fas fa-scale-balanced mr-1"></i>Accuracy over optimism: this tracker records verified state only. ${DATA.meta.figuresSource}`));
</script>
</body>
</html>
